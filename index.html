 <div id="lightbox" class="lightbox">

    <button class="lightbox-close" aria-label="Close">&times;</button>

    <button class="lightbox-arrow lightbox-prev" aria-label="Previous photo">
        &#10094;
    </button>

    <div class="lightbox-image-container">
        <img id="lightbox-img" src="" alt="" draggable="false">
    </div>

    <button class="lightbox-arrow lightbox-next" aria-label="Next photo">
        &#10095;
    </button>

    <div class="lightbox-counter">
        <span id="current-photo">1</span> / <span id="total-photos">24</span>
    </div>

</div>

  <footer>
    <p> Shot on Canon Rebel T6i</p>

  </footer>

 <script>

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    const images = document.querySelectorAll(".gallery img");

    const closeButton = document.querySelector(".lightbox-close");
    const nextButton = document.querySelector(".lightbox-next");
    const previousButton = document.querySelector(".lightbox-prev");

    const currentPhoto = document.getElementById("current-photo");
    const totalPhotos = document.getElementById("total-photos");

    let currentIndex = 0;

    let startX = 0;
    let endX = 0;

    totalPhotos.textContent = images.length;



    /* ---------- OPEN ---------- */

    images.forEach((image, index) => {

        image.addEventListener("click", () => {

            currentIndex = index;

            updateImage(false);

            lightbox.classList.add("open");

            document.body.classList.add("lightbox-open");

        });

    });



    /* ---------- CLOSE ---------- */

    function closeLightbox() {

        lightbox.classList.remove("open");

        document.body.classList.remove("lightbox-open");

    }



    /* ---------- UPDATE IMAGE ---------- */

    function updateImage(animate = true) {

        if (animate) {

            lightboxImg.classList.add("changing");

            setTimeout(() => {

                lightboxImg.src = images[currentIndex].src;
                lightboxImg.alt = images[currentIndex].alt;

                currentPhoto.textContent = currentIndex + 1;

                lightboxImg.classList.remove("changing");

                preloadNeighbors();

            }, 150);

        } else {

            lightboxImg.src = images[currentIndex].src;
            lightboxImg.alt = images[currentIndex].alt;

            currentPhoto.textContent = currentIndex + 1;

            preloadNeighbors();

        }

    }



    /* ---------- NEXT ---------- */

    function nextImage() {

        currentIndex++;

        if (currentIndex >= images.length) {
            currentIndex = 0;
        }

        updateImage();

    }



    /* ---------- PREVIOUS ---------- */

    function previousImage() {

        currentIndex--;

        if (currentIndex < 0) {
            currentIndex = images.length - 1;
        }

        updateImage();

    }



    /* ---------- PRELOAD NEIGHBORING PHOTOS ---------- */

    function preloadNeighbors() {

        const nextIndex =
            (currentIndex + 1) % images.length;

        const previousIndex =
            (currentIndex - 1 + images.length) % images.length;


        const nextPhoto = new Image();
        nextPhoto.src = images[nextIndex].src;


        const previousPhoto = new Image();
        previousPhoto.src = images[previousIndex].src;

    }



    /* ---------- BUTTONS ---------- */

    nextButton.addEventListener("click", (event) => {

        event.stopPropagation();

        nextImage();

    });


    previousButton.addEventListener("click", (event) => {

        event.stopPropagation();

        previousImage();

    });


    closeButton.addEventListener("click", closeLightbox);



    /* ---------- KEYBOARD ---------- */

    document.addEventListener("keydown", (event) => {

        if (!lightbox.classList.contains("open")) {
            return;
        }


        if (event.key === "ArrowRight") {
            nextImage();
        }


        if (event.key === "ArrowLeft") {
            previousImage();
        }


        if (event.key === "Escape") {
            closeLightbox();
        }

    });



    /* ---------- MOUSE DRAG ---------- */

    lightboxImg.addEventListener("mousedown", (event) => {

        startX = event.clientX;

        lightboxImg.style.cursor = "grabbing";

    });


    lightboxImg.addEventListener("mouseup", (event) => {

        endX = event.clientX;

        lightboxImg.style.cursor = "grab";

        handleSwipe();

    });



    /* ---------- MOBILE SWIPE ---------- */

    lightboxImg.addEventListener("touchstart", (event) => {

        startX = event.touches[0].clientX;

    });


    lightboxImg.addEventListener("touchend", (event) => {

        endX = event.changedTouches[0].clientX;

        handleSwipe();

    });



    /* ---------- SWIPE DIRECTION ---------- */

    function handleSwipe() {

        const distance = startX - endX;


        if (distance > 50) {

            nextImage();

        }


        if (distance < -50) {

            previousImage();

        }

    }



    /* ---------- MOUSE WHEEL ---------- */

    let wheelLocked = false;

    lightbox.addEventListener("wheel", (event) => {

        event.preventDefault();


        if (wheelLocked) {
            return;
        }


        wheelLocked = true;


        if (event.deltaY > 0) {

            nextImage();

        } else {

            previousImage();

        }


        setTimeout(() => {

            wheelLocked = false;

        }, 500);

    }, { passive: false });



    /* ---------- CLICK BACKGROUND TO CLOSE ---------- */

    lightbox.addEventListener("click", (event) => {

        if (
            event.target === lightbox ||
            event.target.classList.contains("lightbox-image-container")
        ) {

            closeLightbox();

        }

    });

</script>
<script>

    if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
    }


    const params = new URLSearchParams(window.location.search);

    if (params.get("scroll") === "gallery") {

        // Remove ?scroll=gallery from the URL
        window.history.replaceState({}, "", "index.html");

        // Start at the top
        window.scrollTo(0, 0);

        // Wait 1.5 seconds, then scroll
        setTimeout(() => {

            const gallery = document.getElementById("gallery");

            const galleryPosition =
                gallery.getBoundingClientRect().top + window.scrollY;

            window.scrollTo({
                top: galleryPosition - 180,
                behavior: "smooth"
            });

        }, 600);
    }
</script>
