<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyle Cuba Photography</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>A Selection of my Best Shots</h1>
  </header>

  <main class="gallery">
    <img src="images/IMG_0626.JPG"
         alt="An engine block from Cars and Coffee, July '24">
    <img src="images/IMG_0917.JPG"
         alt="A ladybug on top of Governor Dick tower, September '24">
    <img src="images/IMG_1435.JPG"
         alt="An airplane propellor from WWII weekend in Reading PA, June '26">
    <img src="images/IMG_1575.JPG"
         alt="Chest day at The Foundry, July '26">
    <img src="images/IMG_5523.JPG"
         alt="BMW M3 Engine Block from Cars and Coffee, July '24">
    <img src="images/IMG_5656.JPG"
         alt="An Audi S3 Sedan from Cars and Coffee, May '24">
    <img src="images/IMG_6268.JPG"
         alt="An Airplane from the Lancaster Air Show, September '24">
  </main>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img id="lightbox-img" src="" alt="">
</div>

  <footer>
    <p>© Kyle Cuba</p> 
  </footer>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const images = document.querySelectorAll(".gallery img");
    const close = document.querySelector(".close");

    images.forEach(image => {
        image.addEventListener("click", () => {
            lightbox.style.display = "flex";
            lightboxImg.src = image.src;
            lightboxImg.alt = image.alt;
        });
    });

    close.addEventListener("click", () => {
        lightbox.style.display = "none";
    });

    lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
            lightbox.style.display = "none";
        }
    });
</script>
</body>
</html>
